# ─────────────────────────────────────────────────────────────
# ClipOps — Docker Compose de PRODUCCIÓN (VPS)
#
# Tres servicios:
#   caddy → reverse proxy público (puertos 80/443) + HTTPS automático
#   app   → Next.js 14 (NO expone puertos al exterior)
#   db    → PostgreSQL 16 (NO expone puertos al exterior)
#
# Solo Caddy es accesible desde internet. La app y la base de datos
# solo se hablan dentro de la red interna de Docker.
#
# Arranque en el VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Todas las variables se leen del archivo .env (mismo directorio).
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: clipops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clipops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Sin `ports:` → la DB NO es accesible desde internet, solo desde `app`.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipops-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La app habla con la DB por el nombre de servicio `db` en la red interna.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    expose:
      - "3000"
    # Sin `ports:` → solo Caddy llega a la app, en http://app:3000 (red interna).

  caddy:
    image: caddy:2-alpine
    container_name: clipops-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # El dominio (o subdominio DuckDNS) para el que Caddy saca el certificado.
      DOMAIN: ${DOMAIN}
      # Email para los avisos de Let's Encrypt (renovación/caducidad).
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados emitidos (¡persisten entre reinicios!)
      - caddy_config:/config

volumes:
  clipops_pgdata:
    name: clipops_pgdata
  caddy_data:
    name: clipops_caddy_data
  caddy_config:
    name: clipops_caddy_config
